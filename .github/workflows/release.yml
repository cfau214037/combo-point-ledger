name: Build addon release

on:
  push:
    tags:
      - 'v*.*.*'
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the addon version
        required: true
        type: string

jobs:
  release:
    if: github.event_name != 'create' || (github.ref_type == 'branch' && startsWith(github.ref_name, 'release/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build addon ZIP
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG -creplace '^release/', ''
          if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Expected a release tag like v0.1.0, got '$tag'."
          }

          $manifest = 'ComboPointLedger/ComboPointLedger_Forever.toc'
          $versionLine = Select-String -LiteralPath $manifest -Pattern '^## Version: *(.+)$'
          if (-not $versionLine -or $tag -cne ('v' + $versionLine.Matches[0].Groups[1].Value.Trim())) {
            throw "The version in $manifest must match tag $tag."
          }

          Compress-Archive -Path ComboPointLedger -DestinationPath "ComboPointLedger-$tag.zip"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RELEASE_TAG=$tag"

      - name: Create release tag
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"

      - name: Publish ZIP on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "ComboPointLedger-$RELEASE_TAG.zip" \
            --verify-tag --title "Combo Point Ledger $RELEASE_TAG" --generate-notes
